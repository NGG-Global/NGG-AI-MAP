<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שאלון — פתיחת חלק</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEEF2}
*{box-sizing:border-box}
a{color:#B01A65;text-decoration:none}
:focus-visible{outline:2px solid #EC2A8C;outline-offset:2px}
</style>
</head>
<body>
<div dir="rtl" style="min-height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 20px; background: #EFEEF2; font-family: 'Heebo', sans-serif; color: #15151F">

  <header style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <a href="survey-1-landing.html" aria-label="חזרה" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; color: #15151F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #167349"><span style="width: 7px; height: 7px; border-radius: 50%; background: #167349"></span>נשמר אוטומטית</span>
    </div>
    <div role="progressbar" aria-label="התקדמות בשאלון" aria-valuemin="0" aria-valuemax="6" aria-valuenow="2" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px">
      <span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: #EC2A8C"></span><span style="height: 6px; border-radius: 3px; background: #DFDDDD"></span><span style="height: 6px; border-radius: 3px; background: #DFDDDD"></span><span style="height: 6px; border-radius: 3px; background: #DFDDDD"></span>
    </div>
  </header>

  <section aria-labelledby="st" style="flex: 1; position: relative; overflow: hidden; border-radius: 32px; background: #15151F; color: #FFFFFF; padding: 28px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px">
    <span aria-hidden="true" style="position: absolute; top: 6px; inset-inline-end: 14px; font-size: 190px; font-weight: 900; line-height: 1; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 2px #3A3A40">03</span>
    <span style="position: relative; align-self: flex-start; height: 30px; padding: 0 12px; border-radius: 15px; background: #EC2A8C; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center">חלק 3 מתוך 6</span>
    <h1 id="st" style="position: relative; margin: 0; font-size: 40px; line-height: 1.05; font-weight: 900; letter-spacing: -0.02em">עבודה אג׳נטית</h1>
    <p style="position: relative; margin: 0; font-size: 15px; line-height: 1.6; color: #DFDDDD">9 היגדים קצרים על האופן שבו את/ה משלב/ת כלי AI בעבודה. אין כאן תשובות נכונות — רק תמונה כנה של מה שקורה היום.</p>
    <div style="position: relative; display: flex; flex-wrap: wrap; gap: 8px">
      <span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #2A2A36; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">כ-2 דקות</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #2A2A36; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">סולם 1–5</span>
    </div>
  </section>

  <div style="padding: 16px 18px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 12px">
    <span style="width: 36px; height: 36px; border-radius: 50%; background: #FDEEF6; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#EC2A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg></span>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #3A3A40">חשבו על החודש האחרון. אם היגד לא רלוונטי, אפשר לבחור "מעדיף/ה לא לענות".</p>
  </div>

  <a href="survey-3-likert.html" style="height: 58px; border-radius: 29px; background: #EC2A8C; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">להיגד הראשון<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
</div>
</body>
</html>
