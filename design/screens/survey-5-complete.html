<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שאלון — סיום</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEEF2}
*{box-sizing:border-box}
a{color:#B01A65;text-decoration:none}
:focus-visible{outline:2px solid #EC2A8C;outline-offset:2px}
</style>
</head>
<body>
<div dir="rtl" style="min-height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 20px; background: #EFEEF2; font-family: 'Heebo', sans-serif; color: #15151F">

  <div role="progressbar" aria-label="השאלון הושלם" aria-valuemin="0" aria-valuemax="6" aria-valuenow="6" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; padding-top: 4px">
    <span style="height: 6px; border-radius: 3px; background: #EC2A8C"></span><span style="height: 6px; border-radius: 3px; background: #EC2A8C"></span><span style="height: 6px; border-radius: 3px; background: #EC2A8C"></span><span style="height: 6px; border-radius: 3px; background: #EC2A8C"></span><span style="height: 6px; border-radius: 3px; background: #EC2A8C"></span><span style="height: 6px; border-radius: 3px; background: #EC2A8C"></span>
  </div>

  <section aria-labelledby="dn" style="position: relative; overflow: hidden; border-radius: 32px; background: #EC2A8C; color: #FFFFFF; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 340px; justify-content: flex-end">
    <svg width="320" height="290" viewBox="0 0 30 30" aria-hidden="true" style="position: absolute; top: -50px; inset-inline-end: -80px; opacity: 0.16"><path d="M15 3 L27 25 H3 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"></path><path d="M6 21 C12 17 19 16 27 18" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"></path></svg>
    <span style="position: relative; width: 72px; height: 72px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(255,255,255,0.18)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#EC2A8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
    <h1 id="dn" style="position: relative; margin: 0; font-size: 40px; line-height: 1.05; font-weight: 900; letter-spacing: -0.02em">תודה.<br>התשובות נשמרו.</h1>
    <p style="position: relative; margin: 0; font-size: 15px; line-height: 1.55; color: #FDEEF6">התרומה שלך תעזור לארגון להחליט איפה להשקיע בהטמעת AI.</p>
  </section>

  <section aria-labelledby="nx" style="border-radius: 28px; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 12px">
    <h2 id="nx" style="margin: 0; font-size: 16px; font-weight: 900">מה קורה עכשיו</h2>
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #F7F7F8"><span style="width: 28px; height: 28px; border-radius: 50%; background: #15151F; color: #FFFFFF; font-size: 13px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none">1</span><span style="font-size: 14px; font-weight: 600">השאלון פתוח עד סוף החודש</span></li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #F7F7F8"><span style="width: 28px; height: 28px; border-radius: 50%; background: #15151F; color: #FFFFFF; font-size: 13px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none">2</span><span style="font-size: 14px; font-weight: 600">NGG מנתחת את התשובות ברמה מצרפית</span></li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #F7F7F8"><span style="width: 28px; height: 28px; border-radius: 50%; background: #15151F; color: #FFFFFF; font-size: 13px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none">3</span><span style="font-size: 14px; font-weight: 600">הממצאים יוצגו להנהלה, בלי ציונים אישיים</span></li>
    </ol>
  </section>

  <section aria-label="על NGG" style="margin-top: auto; border-radius: 28px; background: #15151F; color: #FFFFFF; padding: 18px 20px; display: flex; align-items: center; gap: 14px">
    <svg width="40" height="40" viewBox="0 0 30 30" aria-hidden="true" style="flex: none"><path d="M15 3 L27 25 H3 Z" fill="none" stroke="#949494" stroke-width="2.2" stroke-linejoin="round"></path><path d="M6 21 C12 17 19 16 27 18" fill="none" stroke="#EC2A8C" stroke-width="2.4" stroke-linecap="round"></path></svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 900; letter-spacing: 0.03em">NGG</span><span style="font-size: 12px; line-height: 1.45; color: #C7C6C7">האבחון פותח ומופעל על ידי קבוצת נירם גיתן</span></div>
    <a href="#" style="height: 40px; padding: 0 14px; border-radius: 20px; background: #FFFFFF; color: #15151F; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; flex: none">על NGG</a>
  </section>
</div>
</body>
</html>
