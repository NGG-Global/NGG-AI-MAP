<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שאלון — היגד</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEEF2}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:#B01A65;text-decoration:none}
:focus-visible{outline:2px solid #EC2A8C;outline-offset:2px}
</style>
</head>
<body>
<div dir="rtl" style="min-height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 20px; background: #EFEEF2; font-family: 'Heebo', sans-serif; color: #15151F">

  <header style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center">עבודה אג׳נטית</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #167349"><span style="width: 7px; height: 7px; border-radius: 50%; background: #167349"></span>נשמר</span>
    </div>
    <div role="progressbar" aria-label="התקדמות בשאלון" aria-valuemin="0" aria-valuemax="6" aria-valuenow="2" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px">
      <span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: linear-gradient(to left, #EC2A8C 44%, #F7B3D6 44%)"></span><span style="height: 6px; border-radius: 3px; background: #DFDDDD"></span><span style="height: 6px; border-radius: 3px; background: #DFDDDD"></span><span style="height: 6px; border-radius: 3px; background: #DFDDDD"></span>
    </div>
  </header>

  <section aria-labelledby="qt" style="border-radius: 32px; background: #FFFFFF; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 13px; font-weight: 800; color: #B01A65">היגד 4 מתוך 9</span>
    <h1 id="qt" style="margin: 0; font-size: 25px; line-height: 1.3; font-weight: 800; letter-spacing: -0.01em">בחודש האחרון האצלתי לכלי AI משימה שלמה — מהגדרת המטרה ועד תוצר מוכן לבדיקה.</h1>
  </section>

  <div id="likert" role="radiogroup" aria-labelledby="qt" style="display: flex; flex-direction: column; gap: 8px">
    
  </div>

  <div id="skip" style="align-self: center"></div>

  <div style="margin-top: auto; display: flex; gap: 10px">
    <a href="survey-2-section-intro.html" aria-label="להיגד הקודם" style="width: 58px; height: 58px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; color: #15151F; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <a id="next" href="survey-4-multi-select.html" style="flex: 1; height: 58px; border-radius: 29px; background: #EC2A8C; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">הבא<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
    <span id="disabled" aria-disabled="true" style="flex: 1; height: 58px; border-radius: 29px; background: #DFDDDD; color: #5A5A5C; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">בחרו תשובה כדי להמשיך</span>
  </div>
</div>
<script>
(function(){
  var labels=['בכלל לא מסכים/ה','לא מסכים/ה','במידה מסוימת','מסכים/ה','מסכים/ה מאוד'];
  var SEL='<button type="button" role="radio" aria-checked="true" data-n="__N__" style="height: 60px; padding: 0 10px 0 18px; border-radius: 22px; border: 0; background: #15151F; color: #FFFFFF; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: start"><span style="width: 40px; height: 40px; border-radius: 50%; background: #EC2A8C; font-size: 16px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none">__N__</span><span style="flex: 1; font-size: 16px; font-weight: 800">__L__</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F284BD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></button>', UNS='<button type="button" role="radio" aria-checked="false" data-n="__N__" style="height: 60px; padding: 0 10px 0 18px; border-radius: 22px; border: 0; background: #FFFFFF; color: #15151F; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: start"><span style="width: 40px; height: 40px; border-radius: 50%; background: #F4F4F6; font-size: 16px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none">__N__</span><span style="flex: 1; font-size: 16px; font-weight: 600">__L__</span></button>', SK_ON='<button type="button" aria-pressed="true" style="align-self: center; height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #15151F; font-size: 14px; font-weight: 800; color: #FFFFFF; cursor: pointer">✓ מעדיף/ה לא לענות</button>', SK_OFF='<button type="button" aria-pressed="false" style="align-self: center; height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: transparent; font-size: 14px; font-weight: 700; color: #5A5A5C; cursor: pointer">מעדיף/ה לא לענות</button>';
  var picked=null; // null = not answered, 0 = prefer not to answer, 1-5 = scale value
  var box=document.getElementById('likert'), skip=document.getElementById('skip');
  var next=document.getElementById('next'), dis=document.getElementById('disabled');
  function render(){
    box.innerHTML=labels.map(function(l,i){var n=i+1;return (picked===n?SEL:UNS).split('__N__').join(n).replace('__L__',l);}).join('');
    skip.innerHTML=picked===0?SK_ON:SK_OFF;
    var answered=picked!==null;
    next.style.display=answered?'flex':'none'; dis.style.display=answered?'none':'flex';
  }
  box.addEventListener('click',function(e){var b=e.target.closest('button[data-n]'); if(b){picked=+b.getAttribute('data-n'); render();}});
  skip.addEventListener('click',function(e){if(e.target.closest('button')){picked=0; render();}});
  render();
})();
</script>
</body>
</html>
