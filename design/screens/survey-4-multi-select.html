<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שאלון — בחירה מרובה</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEEF2}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:#B01A65;text-decoration:none}
:focus-visible{outline:2px solid #EC2A8C;outline-offset:2px}
</style>
</head>
<body>
<div dir="rtl" style="min-height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 20px; background: #EFEEF2; font-family: 'Heebo', sans-serif; color: #15151F">

  <header style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center">הזדמנויות</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #15151F; color: #FFFFFF; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center">שאלה אחרונה</span>
    </div>
    <div role="progressbar" aria-label="התקדמות בשאלון" aria-valuemin="0" aria-valuemax="6" aria-valuenow="5" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px">
      <span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: #15151F"></span><span style="height: 6px; border-radius: 3px; background: linear-gradient(to left, #EC2A8C 90%, #F7B3D6 90%)"></span>
    </div>
  </header>

  <section aria-labelledby="qt" style="border-radius: 32px; background: #FFFFFF; padding: 24px 22px; display: flex; flex-direction: column; gap: 10px">
    <h1 id="qt" style="margin: 0; font-size: 25px; line-height: 1.3; font-weight: 800; letter-spacing: -0.01em">באילו תחומים הכי היית רוצה להיעזר ב-AI בחצי השנה הקרובה?</h1>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-size: 13px; color: #5A5A5C">אפשר לבחור כמה תשובות</span><span style="height: 28px; padding: 0 12px; border-radius: 14px; background: #FDEEF6; color: #8A1450; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center">נבחרו <span id="count">3</span></span></div>
  </section>

  <div id="choices" role="group" aria-labelledby="qt" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    
  </div>

  <div style="margin-top: auto; display: flex; gap: 10px">
    <a href="survey-3-likert.html" aria-label="לשאלה הקודמת" style="width: 58px; height: 58px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; color: #15151F; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <a href="survey-5-complete.html" style="flex: 1; height: 58px; border-radius: 29px; background: #15151F; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">שליחת השאלון<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F284BD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></a>
  </div>
</div>
<script>
(function(){
  var labels=['כתיבה וניסוח','ניתוח נתונים','סיכום מסמכים ופגישות','הכנת מצגות','אוטומציה של תהליכים','מחקר והכנה','תמיכה בקבלת החלטות','אחר'];
  var ON='<button type="button" aria-pressed="true" data-i="__I__" style="min-height: 76px; padding: 14px; border-radius: 22px; border: 0; background: #EC2A8C; color: #FFFFFF; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; cursor: pointer; text-align: start"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EC2A8C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="font-size: 15px; font-weight: 800; line-height: 1.25">__L__</span></button>', OFF='<button type="button" aria-pressed="false" data-i="__I__" style="min-height: 76px; padding: 14px; border-radius: 22px; border: 0; background: #FFFFFF; color: #15151F; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; cursor: pointer; text-align: start"><span style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #DFDDDD"></span><span style="font-size: 15px; font-weight: 700; line-height: 1.25">__L__</span></button>';
  var picked=[0,1,4];
  var box=document.getElementById('choices'), count=document.getElementById('count');
  function render(){
    box.innerHTML=labels.map(function(l,i){return (picked.indexOf(i)!==-1?ON:OFF).replace('__I__',i).replace('__L__',l);}).join('');
    count.textContent=picked.length;
  }
  box.addEventListener('click',function(e){var b=e.target.closest('button[data-i]'); if(!b)return; var i=+b.getAttribute('data-i'); var k=picked.indexOf(i); if(k===-1)picked.push(i); else picked.splice(k,1); render();});
  render();
})();
</script>
</body>
</html>
